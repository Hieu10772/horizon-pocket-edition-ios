name: unzip-punchy
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -la
          Z="$(ls *.zip | head -n 1)"
          echo "Dung file: $Z"
          unzip -o "$Z"
          rm -f "$Z"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add native-mods/punchy"
          git push

